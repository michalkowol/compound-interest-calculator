<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator procentu składanego</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --ivory:    #FAF9F5;
      --slate:    #141413;
      --clay:     #D97757;
      --oat:      #E3DACC;
      --olive:    #788C5D;
      --gray-150: #F0EEE6;
      --gray-300: #D1CFC5;
      --gray-500: #87867F;
      --gray-700: #3D3D3A;
      --white:    #FFFFFF;

      --serif: ui-serif, Georgia, 'Times New Roman', serif;
      --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono:  ui-monospace, 'SF Mono', Menlo, Monaco, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    [x-cloak] { display: none !important; }

    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--gray-700);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: var(--serif);
      font-weight: 500;
      color: var(--slate);
      letter-spacing: -0.01em;
    }

    h1 { font-size: 38px; line-height: 1.15; }
    h2 { font-size: 24px; line-height: 1.2; }
    h3 { font-size: 18px; line-height: 1.3; }

    p { font-size: 15px; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-500);
    }

    .hint {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 6px;
    }

    .hint.warning { color: var(--clay); }

    hr {
      border: 0;
      border-top: 1.5px solid var(--gray-300);
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      background: var(--oat);
      color: var(--slate);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .field {
      font-family: var(--sans);
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--gray-300);
      background: var(--white);
      color: var(--slate);
      width: 100%;
    }

    .field:focus {
      outline: none;
      border-color: var(--slate);
    }

    .field:disabled {
      background: var(--gray-150);
      color: var(--gray-500);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .form-grid label.eyebrow {
      display: block;
      margin-bottom: 6px;
    }

    .accounts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .account {
      background: var(--white);
      border: 1.5px solid var(--gray-300);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .account h3 { margin-bottom: 4px; }

    .account .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .account label.eyebrow {
      display: block;
      margin-bottom: 6px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--slate);
      cursor: pointer;
    }

    .check input { accent-color: var(--clay); width: 16px; height: 16px; flex-shrink: 0; }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .options .check small {
      color: var(--gray-500);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
    }

    .stat .value {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--slate);
      line-height: 1.2;
      margin-top: 4px;
    }

    .stat .value.small { font-size: 20px; }
    .stat .value.positive { color: var(--olive); }
    .stat .value.accent { color: var(--clay); }

    .split-bar {
      display: flex;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--gray-150);
    }

    .split-bar .contributed { background: var(--slate); }
    .split-bar .profit { background: var(--olive); }
    .split-bar .tax { background: var(--clay); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 13px;
      margin-top: 10px;
    }

    .legend > span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
      background: var(--dot);
    }

    table.spec {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.spec th, table.spec td {
      text-align: right;
      padding: 10px 14px;
      border-bottom: 1.5px solid var(--gray-300);
      white-space: nowrap;
    }

    table.spec th:first-child, table.spec td:first-child { text-align: left; }

    table.spec th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gray-500);
      font-weight: 600;
    }

    table.spec td.mono {
      font-family: var(--mono);
      font-size: 13px;
    }

    .table-wrap { overflow-x: auto; }

    .lang-switch {
      display: inline-flex;
      border: 1.5px solid var(--gray-300);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-switch button {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 4px 12px;
      border: 0;
      background: var(--white);
      color: var(--gray-700);
      cursor: pointer;
    }

    .lang-switch button.active {
      background: var(--slate);
      color: var(--ivory);
    }
  </style>
</head>
<body x-data="calculator()" x-init="$watch('lang', value => applyLang(value)); applyLang(lang)" x-cloak>

  <section style="padding: 56px 32px 32px;">
    <div style="max-width: 860px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div class="eyebrow" x-text="t('eyebrow')"></div>
        <div class="lang-switch" role="group" aria-label="Language">
          <template x-for="code in LANGUAGES" :key="code">
            <button type="button" :class="{ active: lang === code }" @click="lang = code" x-text="code.toUpperCase()"></button>
          </template>
        </div>
      </div>
      <h1 style="margin-bottom: 16px;" x-text="t('title')"></h1>
      <p style="max-width: 60ch;" x-text="t('intro')"></p>
    </div>
  </section>

  <section style="padding: 16px 32px;">
    <div style="max-width: 860px; margin: 0 auto;">
      <h2 style="margin-bottom: 18px;" x-text="t('parameters')"></h2>

      <div class="accounts" style="margin-bottom: 28px;">
        <template x-for="(account, index) in taxFreeAccounts" :key="account.id">
          <div class="account">
            <h3 x-text="t(account.titleKey)"></h3>
            <div class="hint" style="margin-top: 0;" x-text="t('ikeHintFree')"></div>
            <div class="fields">
              <div>
                <label class="eyebrow" :for="`${account.id}-initial`" x-text="t('initial')"></label>
                <input class="field" :id="`${account.id}-initial`" type="text" inputmode="decimal" x-model="account.initial">
              </div>
              <div>
                <label class="eyebrow" :for="`${account.id}-monthly`" x-text="t('monthly')"></label>
                <input class="field" :id="`${account.id}-monthly`" type="text" inputmode="decimal" x-model="account.monthly" :disabled="account.max">
              </div>
            </div>
            <div style="margin-top: 14px; max-width: calc(50% - 7px);">
              <label class="eyebrow" :for="`${account.id}-rate`" x-text="t('rate')"></label>
              <input class="field" :id="`${account.id}-rate`" type="text" inputmode="decimal" x-model="account.rate">
              <div class="hint" x-show="periods !== 1" x-text="t('effective', { rate: percent(effectiveRate(account.rate)) })"></div>
            </div>
            <label class="check" style="margin-top: 14px;">
              <input type="checkbox" x-model="account.max" @change="if (account.max) account.monthly = IKE_LIMIT / 12">
              <span x-text="t('maxLimit', { limit: money(IKE_LIMIT), year: IKE_LIMIT_YEAR })"></span>
            </label>
            <div class="hint warning" x-show="!account.max && num(account.monthly) * 12 > IKE_LIMIT"
                 x-text="t('overLimit', { amount: money(num(account.monthly) * 12), name: t(account.titleKey), year: IKE_LIMIT_YEAR, limit: money(IKE_LIMIT) })"></div>
            <div x-show="account.max" style="margin-top: 14px; max-width: calc(50% - 7px);">
              <label class="eyebrow" :for="`${account.id}-limit-growth`" x-text="t('limitGrowth')"></label>
              <input class="field" :id="`${account.id}-limit-growth`" type="text" inputmode="decimal" x-model="account.limitGrowth">
              <div class="hint" x-text="t('limitGrowthHint', { rate: percent(IKE_LIMIT_GROWTH), from: IKE_HISTORY_FROM, to: IKE_LIMIT_YEAR })"></div>
            </div>
            <div class="hint" x-show="account.max && result.years > 1"
                 x-text="t('limitAtEnd', { year: IKE_LIMIT_YEAR + result.years - 1, limit: money(IKE_LIMIT * Math.pow(1 + num(account.limitGrowth) / 100, result.years - 1)) })"></div>
            <template x-if="index === 0">
              <div>
                <details x-show="anyIkeMax" style="margin-top: 12px; font-size: 13px;">
                  <summary style="cursor: pointer; color: var(--gray-500);" x-text="t('limitHistory')"></summary>
                  <table class="spec" style="margin-top: 8px; font-size: 13px;">
                    <thead>
                      <tr><th x-text="t('year')"></th><th x-text="t('limit')"></th><th x-text="t('change')"></th></tr>
                    </thead>
                    <tbody>
                      <template x-for="entry in ikeHistory" :key="entry.year">
                        <tr>
                          <td class="mono" x-text="entry.year"></td>
                          <td class="mono" x-text="money(entry.limit)"></td>
                          <td class="mono" x-text="entry.change === null ? '' : '+' + percent(entry.change)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </details>
              </div>
            </template>
          </div>
        </template>

        <div class="account">
          <h3 x-text="t('oki')"></h3>
          <div class="hint" style="margin-top: 0;" x-text="t('okiHint')"></div>
          <div class="fields">
            <div>
              <label class="eyebrow" for="oki-initial" x-text="t('initial')"></label>
              <input class="field" id="oki-initial" type="text" inputmode="decimal" x-model="oki.initial">
            </div>
            <div>
              <label class="eyebrow" for="oki-monthly" x-text="t('monthly')"></label>
              <input class="field" id="oki-monthly" type="text" inputmode="decimal" x-model="oki.monthly">
            </div>
            <div>
              <label class="eyebrow" for="oki-rate" x-text="t('rate')"></label>
              <input class="field" id="oki-rate" type="text" inputmode="decimal" x-model="oki.rate">
              <div class="hint" x-show="periods !== 1" x-text="t('effective', { rate: percent(effectiveRate(oki.rate)) })"></div>
            </div>
            <div>
              <label class="eyebrow" for="oki-tax-rate" x-text="t('okiTaxRate')"></label>
              <input class="field" id="oki-tax-rate" type="text" inputmode="decimal" x-model="oki.taxRate">
              <div class="hint" x-text="t('okiTaxRateHint')"></div>
            </div>
          </div>
          <div class="eyebrow" style="margin: 18px 0 10px;" x-text="t('okiAssets')"></div>
          <div class="options">
            <label class="check">
              <input type="radio" name="oki-assets" :value="OKI_LIMITS.investment" x-model.number="oki.threshold">
              <span><span x-text="t('okiInvestment', { limit: money(OKI_LIMITS.investment) })"></span> <small x-text="t('okiInvestmentHint')"></small></span>
            </label>
            <label class="check">
              <input type="radio" name="oki-assets" :value="OKI_LIMITS.savings" x-model.number="oki.threshold">
              <span><span x-text="t('okiSavings', { limit: money(OKI_LIMITS.savings) })"></span> <small x-text="t('okiSavingsHint')"></small></span>
            </label>
          </div>
        </div>

        <div class="account">
          <h3 x-text="t('brokerage')"></h3>
          <div class="hint" style="margin-top: 0;" x-text="t('brokerageHint')"></div>
          <div class="fields">
            <div>
              <label class="eyebrow" for="brokerage-initial" x-text="t('initial')"></label>
              <input class="field" id="brokerage-initial" type="text" inputmode="decimal" x-model="brokerage.initial">
            </div>
            <div>
              <label class="eyebrow" for="brokerage-monthly" x-text="t('monthly')"></label>
              <input class="field" id="brokerage-monthly" type="text" inputmode="decimal" x-model="brokerage.monthly">
            </div>
          </div>
          <div style="margin-top: 14px; max-width: calc(50% - 7px);">
            <label class="eyebrow" for="brokerage-rate" x-text="t('rate')"></label>
            <input class="field" id="brokerage-rate" type="text" inputmode="decimal" x-model="brokerage.rate">
            <div class="hint" x-show="periods !== 1" x-text="t('effective', { rate: percent(effectiveRate(brokerage.rate)) })"></div>
          </div>
          <div class="eyebrow" style="margin: 18px 0 10px;" x-text="t('belka')"></div>
          <div class="options">
            <label class="check">
              <input type="radio" name="tax" value="none" x-model="taxMode">
              <span x-text="t('taxNone')"></span>
            </label>
            <label class="check">
              <input type="radio" name="tax" value="capitalization" x-model="taxMode">
              <span><span x-text="t('taxCap')"></span> <small x-text="t('taxCapHint')"></small></span>
            </label>
            <label class="check">
              <input type="radio" name="tax" value="end" x-model="taxMode">
              <span><span x-text="t('taxEnd')"></span> <small x-text="t('taxEndHint')"></small></span>
            </label>
          </div>
        </div>
      </div>

      <h3 style="margin-bottom: 14px;" x-text="t('shared')"></h3>

      <div class="form-grid" style="margin-bottom: 8px;">
        <div>
          <label class="eyebrow" for="years" x-text="t('years')"></label>
          <input class="field" id="years" type="text" inputmode="numeric" x-model="years">
        </div>
        <div>
          <label class="eyebrow" for="periods" x-text="t('compounding')"></label>
          <select class="field" id="periods" x-model.number="periods">
            <template x-for="option in compoundingOptions" :key="option.periods">
              <option :value="option.periods" x-text="t(option.labelKey)" :selected="option.periods === periods"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="eyebrow" for="inflation" x-text="t('inflation')"></label>
          <input class="field" id="inflation" type="text" inputmode="decimal" x-model="inflation" :disabled="!inflationEnabled">
          <div class="options" style="margin-top: 10px;">
            <label class="check">
              <input type="checkbox" x-model="inflationEnabled">
              <span x-text="t('inflationEnabled')"></span>
            </label>
            <label class="check" :style="!inflationEnabled && 'opacity: 0.5; cursor: default;'">
              <input type="checkbox" x-model="indexContributions" :disabled="!inflationEnabled">
              <span x-text="t('indexContributions')"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </section>

  <hr style="margin: 40px 32px;">

  <section style="padding: 0 32px;">
    <div style="max-width: 860px; margin: 0 auto;">
      <h2 style="margin-bottom: 18px;" x-text="t('resultAfter', { years: yearsLabel(result.years) })"></h2>

      <div class="stats" style="margin-bottom: 28px;">
        <div class="stat">
          <div class="eyebrow" x-text="t(anyTax ? 'balanceAfterTax' : 'finalBalance')"></div>
          <div class="value" x-text="money(result.net)"></div>
        </div>
        <div class="stat">
          <div class="eyebrow" x-text="t('contributedTotal')"></div>
          <div class="value" x-text="money(result.contributed)"></div>
        </div>
        <div class="stat">
          <div class="eyebrow" x-text="t('netProfit')"></div>
          <div class="value positive" x-text="money(result.profit)"></div>
        </div>
        <div class="stat" x-show="anyTax">
          <div class="eyebrow" x-text="t(hasValue(oki) ? 'tax' : 'belka')"></div>
          <div class="value accent" x-text="money(result.tax)"></div>
        </div>
        <div class="stat" x-show="inflationEnabled">
          <div class="eyebrow" x-text="t('realValue')"></div>
          <div class="value accent" x-text="money(result.real)"></div>
        </div>
      </div>

      <div class="stats" style="margin-bottom: 28px;">
        <div class="stat">
          <div class="eyebrow" x-text="t('ike')"></div>
          <div class="value small" x-text="money(result.ikes[0])"></div>
        </div>
        <div class="stat" x-show="hasValue(partner)">
          <div class="eyebrow" x-text="t('partnerIke')"></div>
          <div class="value small" x-text="money(result.ikes[1])"></div>
        </div>
        <div class="stat" x-show="hasValue(oki)">
          <div class="eyebrow" x-text="t('oki')"></div>
          <div class="value small" x-text="money(result.oki)"></div>
        </div>
        <div class="stat">
          <div class="eyebrow" x-text="t(taxMode === 'none' ? 'brokerage' : 'brokerageAfterTax')"></div>
          <div class="value small" x-text="money(result.brokerage)"></div>
        </div>
        <div class="stat" x-show="taxMode !== 'none'">
          <div class="eyebrow" x-text="t('ikeSaving')"></div>
          <div class="value small positive" x-text="money(result.ikeTaxSaved)"></div>
        </div>
      </div>

      <div class="split-bar">
        <div class="contributed" :style="`width: ${result.shares.contributed}%`"></div>
        <div class="profit" :style="`width: ${result.shares.profit}%`"></div>
        <div class="tax" :style="`width: ${result.shares.tax}%`"></div>
      </div>
      <div class="legend">
        <span style="--dot: var(--slate);"><span x-text="t('contributions')"></span> <span class="tag" x-text="percent(result.shares.contributed)"></span></span>
        <span style="--dot: var(--olive);"><span x-text="t('netProfit')"></span> <span class="tag" x-text="percent(result.shares.profit)"></span></span>
        <span style="--dot: var(--clay);" x-show="anyTax"><span x-text="t('tax')"></span> <span class="tag" x-text="percent(result.shares.tax)"></span></span>
      </div>

      <p x-show="anyTax" style="margin-top: 20px; color: var(--gray-500);">
        <span x-show="hasValue(oki)" x-text="t('noteOki')"></span>
        <span x-show="taxMode === 'capitalization'" x-text="t('noteCap')"></span>
        <span x-show="taxMode === 'end'" x-text="t('noteEnd')"></span>
        <span x-show="taxMode !== 'none'" x-text="t('noteSaving')"></span>
      </p>
      <p x-show="inflationEnabled" style="margin-top: 12px; color: var(--gray-500);">
        <span x-text="t('noteReal', { inflation: percent(num(inflation)) })"></span>
        <span x-text="t('realRates', { list: realRatesList })"></span>
      </p>
    </div>
  </section>

  <section style="padding: 40px 32px 96px;">
    <div style="max-width: 860px; margin: 0 auto;">
      <h2 style="margin-bottom: 6px;" x-text="t('yearByYear')"></h2>
      <p class="hint" style="margin-bottom: 18px;" x-show="taxMode === 'end'" x-text="t('endHint')"></p>
      <div class="table-wrap">
        <table class="spec">
          <thead>
            <tr>
              <th x-text="t('year')"></th>
              <th x-text="t('contributed')"></th>
              <th x-show="anyIkeMax" x-text="t('ikeContribution')"></th>
              <th x-text="t('ike')"></th>
              <th x-show="hasValue(partner)" x-text="t('partnerIke')"></th>
              <th x-show="hasValue(oki)" x-text="t('oki')"></th>
              <th x-text="t('brokerageShort')"></th>
              <th x-show="anyTax" x-text="t('tax')"></th>
              <th x-text="t('netProfit')"></th>
              <th x-text="t('balance')"></th>
              <th x-show="inflationEnabled" x-text="t('realBalance')"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in result.rows" :key="row.year">
              <tr>
                <td class="mono" x-text="row.year"></td>
                <td class="mono" x-text="money(row.contributed)"></td>
                <td class="mono" x-show="anyIkeMax" x-text="money(row.ikeYearContribution)"></td>
                <td class="mono" x-text="money(row.ikes[0])"></td>
                <td class="mono" x-show="hasValue(partner)" x-text="money(row.ikes[1])"></td>
                <td class="mono" x-show="hasValue(oki)" x-text="money(row.oki)"></td>
                <td class="mono" x-text="money(row.brokerage)"></td>
                <td class="mono" style="color: var(--clay);" x-show="anyTax" x-text="money(row.tax)"></td>
                <td class="mono" style="color: var(--olive);" x-text="money(row.profit)"></td>
                <td class="mono" style="color: var(--slate);" x-text="money(row.net)"></td>
                <td class="mono" style="color: var(--clay);" x-show="inflationEnabled" x-text="money(row.real)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    const BELKA = 0.19;
    const OKI_LIMITS = { investment: 100000, savings: 25000 };
    const OKI_TAX_RATE = 0.85;
    const IKE_LIMITS = {
      2015: 11877, 2016: 12348, 2017: 12744, 2018: 13293, 2019: 13824, 2020: 15681,
      2021: 15777, 2022: 17766, 2023: 20805, 2024: 23472, 2025: 26019, 2026: 28260
    };
    const IKE_HISTORY_YEARS = Object.keys(IKE_LIMITS).map(Number);
    const IKE_HISTORY_FROM = IKE_HISTORY_YEARS[0];
    const IKE_LIMIT_YEAR = IKE_HISTORY_YEARS[IKE_HISTORY_YEARS.length - 1];

    const LOCALES = { pl: 'pl-PL', en: 'en-GB' };

    function detectLanguage() {
      const saved = localStorage.getItem('lang');
      if (LANGUAGES.includes(saved)) return saved;
      const preferred = (navigator.languages ?? [navigator.language]).map(code => code.slice(0, 2).toLowerCase());
      return preferred.find(code => LANGUAGES.includes(code)) ?? 'en';
    }

    const formatters = Object.fromEntries(LANGUAGES.map(code => [code, {
      money: new Intl.NumberFormat(LOCALES[code], { style: 'currency', currency: 'PLN', maximumFractionDigits: 0 }),
      percent: new Intl.NumberFormat(LOCALES[code], { maximumFractionDigits: 2 })
    }]));

    function num(value) {
      if (typeof value === 'number') return value;
      let text = String(value).replace(/\s/g, '');
      // "1,234.5" uses the comma as a thousands separator, "8,2" as the decimal one
      text = text.includes('.') ? text.replace(/,/g, '') : text.replace(',', '.');
      const parsed = Number(text);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function monthlyFactor(rate, periods) {
      return Math.pow(1 + rate / 100 / periods, periods / 12);
    }

    function sum(values) {
      return values.reduce((total, value) => total + value, 0);
    }

    function simulate({ ikes, oki, brokerage, periods, years, inflation, indexContributions, taxMode }) {
      const months = Math.max(0, Math.round(years)) * 12;
      const yearlyInflation = 1 + inflation / 100;
      const taxOnCapitalization = taxMode === 'capitalization';
      const taxOnEnd = taxMode === 'end';

      const createAccount = (params, taxed) => ({
        ...params,
        balance: params.initial,
        contributed: params.initial,
        yearContribution: 0,
        yearBalanceSum: 0,
        taxPaid: 0,
        taxed,
        factor: monthlyFactor(taxed ? params.rate * (1 - BELKA) : params.rate, periods)
      });

      const ikeAccounts = ikes.map(params => createAccount(params, false));
      // shadows of the IKE money as if it sat on a taxed brokerage account
      const ikeShadows = ikes.map(params => createAccount(params, taxOnCapitalization));
      const okiAccount = createAccount(oki, false);
      const brokerageAccount = createAccount(brokerage, taxOnCapitalization);
      const allAccounts = [...ikeAccounts, ...ikeShadows, okiAccount, brokerageAccount];

      const belkaDue = account => taxOnEnd ? BELKA * Math.max(0, account.balance - account.contributed) : 0;

      const snapshot = year => {
        const ikeNets = ikeAccounts.map(account => account.balance);
        const shadowNets = ikeShadows.map(account => account.balance - belkaDue(account));
        const brokerageTaxDue = belkaDue(brokerageAccount);
        const brokerageNet = brokerageAccount.balance - brokerageTaxDue;
        const net = sum(ikeNets) + okiAccount.balance + brokerageNet;
        const contributed = sum(ikeAccounts.map(account => account.contributed)) + okiAccount.contributed + brokerageAccount.contributed;
        return {
          year,
          contributed,
          ikes: ikeNets,
          ikeYearContribution: sum(ikeAccounts.map(account => account.yearContribution)),
          oki: okiAccount.balance,
          brokerage: brokerageNet,
          tax: brokerageAccount.taxPaid + brokerageTaxDue + okiAccount.taxPaid,
          profit: net - contributed,
          net,
          real: net / Math.pow(yearlyInflation, year),
          ikeTaxSaved: sum(ikeNets) - sum(shadowNets)
        };
      };

      const initial = snapshot(0);
      const rows = [];

      for (let month = 1; month <= months; month++) {
        const yearIndex = Math.floor((month - 1) / 12);
        const indexation = indexContributions ? Math.pow(yearlyInflation, yearIndex) : 1;

        for (const account of allAccounts) {
          const growth = account.max ? Math.pow(1 + account.limitGrowth / 100, yearIndex) : indexation;
          const contribution = account.monthly * growth;
          account.yearContribution = (month % 12 === 1 ? 0 : account.yearContribution) + contribution;
          account.balance += contribution;
          account.contributed += contribution;
          const interest = account.balance * (account.factor - 1);
          if (account.taxed) {
            account.taxPaid += interest * BELKA / (1 - BELKA);
          }
          account.balance += interest;
          account.yearBalanceSum += account.balance;
        }

        if (month % 12 === 0) {
          // OKI: yearly tax on the average asset value above the exemption limit
          const okiTax = okiAccount.taxRate / 100 * Math.max(0, okiAccount.yearBalanceSum / 12 - okiAccount.threshold);
          okiAccount.balance -= okiTax;
          okiAccount.taxPaid += okiTax;
          for (const account of allAccounts) {
            account.yearBalanceSum = 0;
          }
          rows.push(snapshot(month / 12));
        }
      }

      const last = rows[rows.length - 1] ?? initial;
      const gross = last.net + last.tax;
      const share = value => gross > 0 ? Math.min(100, Math.max(0, value / gross * 100)) : 0;

      return {
        years: rows.length,
        rows,
        ...last,
        shares: {
          contributed: share(last.contributed),
          profit: share(Math.max(0, last.profit)),
          tax: share(last.tax)
        }
      };
    }

    function calculator() {
      return {
        IKE_LIMIT,
        OKI_LIMITS,
        IKE_LIMIT_YEAR,
        IKE_HISTORY_FROM,
        IKE_LIMIT_GROWTH,
        ikeHistory: IKE_HISTORY_YEARS.map((year, i) => ({
          year,
          limit: IKE_LIMITS[year],
          change: i === 0 ? null : (IKE_LIMITS[year] / IKE_LIMITS[IKE_HISTORY_YEARS[i - 1]] - 1) * 100
        })).reverse(),
        LANGUAGES,
        lang: detectLanguage(),
        ike: { id: 'ike', titleKey: 'ike', initial: 0, monthly: IKE_LIMIT / 12, rate: 7, max: true, limitGrowth: DEFAULT_LIMIT_GROWTH },
        partner: { id: 'partner-ike', titleKey: 'partnerIke', initial: 0, monthly: IKE_LIMIT / 12, rate: 7, max: true, limitGrowth: DEFAULT_LIMIT_GROWTH },
        oki: { titleKey: 'oki', initial: 0, monthly: 0, rate: 7, taxRate: OKI_TAX_RATE, threshold: OKI_LIMITS.investment },
        brokerage: { titleKey: 'brokerage', initial: 10000, monthly: 500, rate: 7 },
        periods: 1,
        years: 20,
        taxMode: 'none',
        inflationEnabled: false,
        inflation: 3.5,
        indexContributions: false,

        compoundingOptions: [
          { periods: 365, labelKey: 'daily' },
          { periods: 12, labelKey: 'monthlyPeriod' },
          { periods: 4, labelKey: 'quarterly' },
          { periods: 2, labelKey: 'semiannual' },
          { periods: 1, labelKey: 'annual' }
        ],

        num,

        get result() {
          const inflationOn = this.inflationEnabled;
          return simulate({
            ikes: this.taxFreeAccounts.map(account => ({
              initial: num(account.initial),
              monthly: account.max ? IKE_LIMIT / 12 : num(account.monthly),
              rate: num(account.rate),
              max: account.max,
              limitGrowth: num(account.limitGrowth)
            })),
            oki: {
              initial: num(this.oki.initial),
              monthly: num(this.oki.monthly),
              rate: num(this.oki.rate),
              max: false,
              taxRate: num(this.oki.taxRate),
              threshold: num(this.oki.threshold)
            },
            brokerage: { initial: num(this.brokerage.initial), monthly: num(this.brokerage.monthly), rate: num(this.brokerage.rate), max: false },
            periods: num(this.periods) || 1,
            years: Math.min(100, num(this.years)),
            inflation: inflationOn ? num(this.inflation) : 0,
            indexContributions: inflationOn && this.indexContributions,
            taxMode: this.taxMode
          });
        },

        get taxFreeAccounts() {
          return [this.ike, this.partner];
        },

        hasValue(account) {
          return num(account.initial) > 0 || num(account.monthly) > 0 || account.max;
        },

        get realRatesList() {
          const accounts = [this.ike, ...[this.partner, this.oki].filter(account => this.hasValue(account)), this.brokerage];
          return accounts.map(account => `${this.t(account.titleKey)} ${this.percent(this.realRate(account.rate))}`).join(', ');
        },

        get anyIkeMax() {
          return this.taxFreeAccounts.some(account => account.max);
        },

        get anyTax() {
          return this.taxMode !== 'none' || this.hasValue(this.oki);
        },

        effectiveRate(rate) {
          const periods = num(this.periods) || 1;
          return (Math.pow(1 + num(rate) / 100 / periods, periods) - 1) * 100;
        },

        realRate(rate) {
          const nominal = 1 + this.effectiveRate(rate) / 100;
          const inflation = 1 + num(this.inflation) / 100;
          return (nominal / inflation - 1) * 100;
        },

        t(key, params = {}) {
          const template = TRANSLATIONS[this.lang][key] ?? key;
          return template.replace(/\{(\w+)\}/g, (match, name) => params[name] ?? '');
        },

        applyLang(lang) {
          localStorage.setItem('lang', lang);
          document.documentElement.lang = lang;
          document.title = this.t('pageTitle');
        },

        money(value) {
          return formatters[this.lang].money.format(value);
        },

        percent(value) {
          return formatters[this.lang].percent.format(value) + '%';
        },

        yearsLabel(n) {
          return n === 1 ? this.t('yearsOne') : this.t('yearsMany', { n });
        }
      };
    }
